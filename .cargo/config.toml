[alias]
lint = "clippy --workspace --all-targets --locked -- --deny warnings"
docs = "doc --no-deps --workspace"

# ONNX Runtime's WebGPU build needs libwebgpu_dawn.so beside the executable; ort's copy-dylibs links it into target/.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
