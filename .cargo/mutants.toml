# Mutation testing examines only the high-risk state, delivery, hold-key and config-save files;
# a survivor in any of them fails the Heavy shard that found it.
examine_globs = [
    "crates/thalvi-desktop/src/hold.rs",
    "crates/thalvi-desktop/src/delivery.rs",
    "crates/thalvi-desktop/src/engine.rs",
    "crates/thalvi-desktop/src/engine/streaming.rs",
    "crates/thalvi-app/src/settings.rs",
    "crates/thalvi-app/src/runner.rs",
]

exclude_re = [
    # Equivalent: the runtime still drops when the call returns, and the engine thread then ends and drops the sender, which wakes wait_stopped.
    "^crates/thalvi-app/src/runner.rs:\\d+:\\d+: replace finish_runtime with \\(\\)$",
    # Nothing reads a restart request's debug text.
    "^crates/thalvi-app/src/runner.rs:\\d+:\\d+: replace <impl std::fmt::Debug for Restart>::fmt ",
    # Each caller has input frames, which pause clears, and step returns before any caller when stopping.
    "^crates/thalvi-app/src/runner.rs:\\d+:\\d+: replace \\|\\| with && in Runner<S>::end_unopened_feed$",
    # The native output adapter's drop hook calls CueEngine::stop, which is tested with a fake speaker.
    "^crates/thalvi-desktop/src/engine.rs:\\d+:\\d+: replace <impl Drop for StopOnDrop>::drop with \\(\\)$",
    # Equivalent: keeping frames no consumer reads changes memory use, not what a capture delivers or records.
    "^crates/thalvi-desktop/src/engine.rs:\\d+:\\d+: replace Engine<R, W, C>::keeps_sent -> bool with true$",
    # Equivalent: frame and release orders come from one process-wide counter, so they are equal only after it wraps.
    "^crates/thalvi-desktop/src/hold.rs:\\d+:\\d+: replace < with <= in Cutoff::precedes$",
    # Equivalent: the down branch returns right after the write, and every later key event reconciles the bits before reading them.
    "^crates/thalvi-desktop/src/hold.rs:\\d+:\\d+: replace \\|= with &= in HoldHook::on_modifier$",
]
