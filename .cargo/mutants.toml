# Compiled only on Windows, run only with speech model files CI doesn't have, or run only inside the app: survivors here say nothing.
exclude_globs = [
    "crates/thalvi-desktop/src/host/windows.rs",
    "crates/thalvi-desktop/src/host/windows/**",
    # Dawn and ONNX Runtime FFI that needs a GPU, which CI has none of, and its Windows stand-in: the placement rule they apply is tested in device.rs.
    "crates/thalvi-desktop/src/device/webgpu.rs",
    "crates/thalvi-desktop/src/device/windows.rs",
    "crates/thalvi-app/src/menu_entry/windows.rs",
    # Test doubles for the integration tests, not shipped behavior.
    "crates/thalvi-desktop/src/engine/fakes.rs",
]
exclude_re = [
    "approval::",
    "OnnxJoiner",
    "TransducerStream::decode",
    "run_predictor",
    # Equivalent mutants: no input can tell them from the code.
    # Dropping zero samples changes nothing.
    "replace > with >= in Samples::drop_before",
    # A bin exactly on a filter's edge has weight zero, and equal terms add the same either way round.
    "replace [<>] with [<>]= in (kaldi_filters|log_add)",
    # Bins past Nyquist are in no filter either way.
    "replace / with \\* in kaldi_filters",
    # The winner of a second pass answered ok, so it is never in the list of failures either way.
    "replace > with >= in .*::reconcile",
    # The encoder window is 45 samples, which no chunk length divisible by 4 can equal.
    "replace > with >= in Network::load",
    # The pinned decoder accepts -1 and 1 alike as the first context token.
    "delete - in Network::check",
    # Tauri state and commands, and the keys and clicks of the real desktop, run only inside the app.
    "AppState::",
    "impl Running for Live",
    "watch_hold_keys",
    "overlay_takes_clicks",
    "on_menu",
    "replace save_settings ->",
    # Tauri commands that only pass AppState to SpeechDevices, ModelStore and Download, which the tests above them cover.
    # The count of intra-op threads changes speed, not output.
    "replace threads ->",
    # Needs a model loaded on a GPU; the counts it hands to the metric are tested through a fake model.
    "<impl SpeechModel for Transducer>::placement",
    # The engine thread starts, rebuilds and spawns the load around a real engine and microphone; the load it shows is tested.
    "Runner::(start|rebuild|load_speech_model)",
    "crates/thalvi-app/src/(app|commands).rs.*replace (start|list_speech_models|speech_device|download_speech_model) ->",
    "get_hold_key_unavailable",
    # Picks the hold key check by the session in the process environment, which a test cannot set (unsafe_code is denied); Hyprland's check is tested directly.
    "replace Desktop::check_hold_keys ->",
    # Reads the process environment, which a test cannot set (unsafe_code is denied); the socket path it joins is tested through Events::connect.
    "delete ! in Events::system",
    # The updater's Tauri wiring, tray lines and commands run only inside the app; the driver and marker they carry are tested in update.rs.
    "run_updates",
    "follow_updates",
    "<impl Restarter for AppRestarter>",
    "crates/thalvi-app/src/app.rs.*replace (setup|follow_engine|show) ",
    "crates/thalvi-app/src/commands.rs.*replace (check_for_updates|open_release_notes) ",
    "Tray::(say|update|show)",
    # The tauri-plugin-updater adapter needs the plugin, the process environment and a real feed; the driver uses it through a tested fake Source.
    "<impl Source for PluginSource>",
    "appimage_of",
    "match guard error.is_timeout\\(\\) with (true|false) in explain",
    # The restart's wall-clock time only feeds a metric the next start writes.
    "replace now_ms -> u64",
    # Quitting waits on the real engine thread, which only the app starts; its quit flow is the formal check's.
    "replace EngineLink::quit with \\(\\)",
    # Nothing reads a restart request's debug text.
    "<impl std::fmt::Debug for Restart>::fmt",
]
