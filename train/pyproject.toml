[project]
name = "thalvi-train"
version = "0.1.0"
description = "Training and evaluation for Thalvi's audio adapter for Muse Glimmer."
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.12",
  "httpx>=0.28",
  "numpy>=2.3",
  "safetensors>=0.7",
  "soundfile>=0.13",
  "soxr>=1.0",
  "transformers>=5.20",
]

[project.optional-dependencies]
cpu = ["torch>=2.11"]
cu128 = ["torch>=2.11", "bitsandbytes>=0.50"]

[dependency-groups]
dev = ["modal>=1.6", "pytest>=9", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
