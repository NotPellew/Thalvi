[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.3"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
dirs = "7"
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["sink"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rtrb = "0.4"
nix = { version = "0.31", default-features = false, features = ["socket"] }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
gtk = "0.18.2"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
thalvi-asr = { path = "crates/thalvi-asr" }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc-vad = "0.4"
xkbcommon = { version = "0.9", default-features = false }
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
