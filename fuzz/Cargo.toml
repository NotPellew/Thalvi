[package]
name = "thalvi-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the root one, `cargo lint` and the stable toolchain never see this nightly-only crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1"
thalvi-asr = { path = "../crates/thalvi-asr" }
thalvi-desktop = { path = "../crates/thalvi-desktop" }

[[bin]]
name = "tasks_decide"
path = "fuzz_targets/tasks_decide.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spoken_numbers"
path = "fuzz_targets/spoken_numbers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "asr_frame"
path = "fuzz_targets/asr_frame.rs"
test = false
doc = false
bench = false
