name: Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  semantic-title:
    name: semantic-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the PR title passes the commit-msg hook
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"

  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every non-merge commit in the PR passes the commit-msg hook
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              status=1
            fi
          done
          exit "$status"

  # The one check of this workflow that branch protection requires. It runs even when
  # a job it waits for failed or was cancelled, and passes only when each of them passed
  # or was skipped by its own condition. A new job goes in `needs`, not in the protection.
  commits-ok:
    name: commits-ok
    needs: [semantic-title, commit-messages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job it waits for passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -c '
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS"]).items()}
          print(results)
          failed = sorted(job for job, result in results.items() if result not in ("success", "skipped"))
          sys.exit(f"not passed: {failed}" if failed else 0)'
