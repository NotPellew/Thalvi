[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "thalvi-desktop"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["websockets==17.4", "numpy==2.5.4"]

[project.optional-dependencies]
audio = ["sounddevice==0.5.6", "sherpa-onnx==2.0.1", "sentencepiece==0.2.2"]

[dependency-groups]
dev = ["playwright==1.63.0", "pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
thalvi-desktop = "thalvi_desktop.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
