# Choose unused keys and uncomment only the bindings you want in hyprland.conf.
# These commands only talk to a running Thalvi: with none running they print why and start nothing.
# bind = SUPER SHIFT, M, exec, thalvi-desktop toggle
# Idempotent alternatives, safe to bind to a key and press repeatedly:
# bind = SUPER ALT, M, exec, thalvi-desktop pause
# bind = SUPER ALT, R, exec, thalvi-desktop resume
# bind = SUPER, Escape, exec, thalvi-desktop cancel
# Copies the report of the last error shown; fails when there has been none:
# bind = SUPER, E, exec, thalvi-desktop copy-error

# Hold a key to dictate: hold it, speak, let go, and the text is pasted into the window that
# was focused when you pressed. Nothing is said to start or end it, and Enter is never pressed.
# Set it by uncommenting BOTH lines, then `hyprctl reload`. A press with no Thalvi running
# prints why and starts nothing. If another tool already binds the key, such as
# `bind = ALT, Y, exec, hex dictation start`, remove that bind first.
#   bind   = ALT, code:52, exec, thalvi-desktop hold-start
#   bindri = ALT, code:52, exec, thalvi-desktop hold-end
# The key is where it sits on the keyboard, not what it types: code:52 is the key left of X
# (Z on a QWERTY keyboard, Y on a QWERTZ one). To change it, use another keycode on both lines
# (`wev` prints the code of a pressed key) or other modifiers in the first field. The `i` in
# `bindri` lets the release count even if Alt is let go before the key. To remove it, delete
# or comment out both lines; removing only `bindri` leaves a capture open until it times out.
# The `hold_key` setting in desktop.json is for Windows; here the bind is the key.
